name: 多账号自动登录续期任务

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 获取代码仓库
        uses: actions/checkout@v3

      - name: 配置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖包
        # 不屏蔽输出，直接打印到控制台方便查看安装进度和排错
        run: |
          pip install seleniumbase ddddocr PyAutoGUI

      - name: 🚀 智能解析全协议节点并启动 Xray
        env:
          PROXY: ${{ secrets.PROXY }}
        run: |
          echo ">>> 正在下载 Xray-core 客户端 (支持全协议)..."
          wget https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip || { echo "❌ 下载失败！"; exit 1; }
          unzip Xray-linux-64.zip
          chmod +x xray
          
          echo ">>> 正在生成 Python 解析脚本..."
          # 使用 cat << 'EOF' 语法，将下方的 Python 代码动态写入到虚拟机的 parse_proxy.py 文件中
          # 这种方式能够确保生成的文件严格遵循 Unix (LF) 换行符，避免报错
          cat << 'EOF' > parse_proxy.py
          import os, sys, json, base64
          from urllib.parse import urlparse, parse_qs
          
          # 1. 从环境变量获取我们填入的节点链接
          link = os.environ.get('PROXY', '').strip()
          if not link:
              print("❌ 错误：环境变量 PROXY 为空！")
              sys.exit(1)
          
          # 2. 准备基础的 Xray 模板 (固定在本地 10808 端口开启 socks5 监听)
          config = {
              "log": {"loglevel": "warning"},
              "inbounds": [{
                  "port": 10808,
                  "listen": "127.0.0.1",
                  "protocol": "socks",
                  "settings": {"udp": True}
              }],
              "outbounds": []
          }
          
          outbound = {"protocol": "", "settings": {}, "streamSettings": {}}
          
          # 用于安全解码 VMess 的 Base64 字符串的方法
          def decode_b64(s):
              s = s.replace('-', '+').replace('_', '/')
              # 自动补全 Base64 缺少的 "=" 等号
              s += "=" * ((4 - len(s) % 4) % 4)
              return base64.b64decode(s).decode('utf-8')
          
          try:
              # ======= 处理 VMess 协议 =======
              if link.startswith("vmess://"):
                  outbound["protocol"] = "vmess"
                  # 去掉开头的 "vmess://" (共8个字符)，然后解码剩下的 Base64
                  v_json = json.loads(decode_b64(link[8:]))
                  
                  # 按照 Xray 的规范重新组装配置字典
                  outbound["settings"] = {
                      "vnext": [{
                          "address": v_json.get("add", ""),
                          "port": int(v_json.get("port", 443)),
                          "users": [{
                              "id": v_json.get("id", ""), 
                              "alterId": int(v_json.get("aid", 0)), 
                              "security": v_json.get("scy", "auto")
                          }]
                      }]
                  }
                  
                  # 处理网络传输类型 (tcp, ws) 和伪装域名
                  net = v_json.get("net", "tcp")
                  outbound["streamSettings"]["network"] = net
                  if net == "ws":
                      outbound["streamSettings"]["wsSettings"] = {
                          "path": v_json.get("path", "/"),
                          "headers": {"Host": v_json.get("host", "")} if v_json.get("host") else {}
                      }
                  if v_json.get("tls") == "tls":
                      outbound["streamSettings"]["security"] = "tls"
                      outbound["streamSettings"]["tlsSettings"] = {"serverName": v_json.get("sni", "") or v_json.get("add", "")}
                      
              # ======= 处理 VLESS / Trojan 协议 =======
              elif link.startswith("vless://") or link.startswith("trojan://"):
                  parsed = urlparse(link)
                  proto = parsed.scheme
                  outbound["protocol"] = proto
                  
                  # 提取 URL 中的账号密码、IP和端口
                  uuid_or_pass = parsed.username or ""
                  host = parsed.hostname or ""
                  port = parsed.port or 443
                  # 解析问号 ? 后面的所有参数 (如 sni, type, pbk 等)
                  qs = parse_qs(parsed.query) 
                  
                  if proto == "vless":
                      outbound["settings"] = {
                          "vnext": [{
                              "address": host,
                              "port": port,
                              "users": [{"id": uuid_or_pass, "encryption": qs.get("encryption", ["none"])[0]}]
                          }]
                      }
                  else:
                      outbound["settings"] = {"servers": [{"address": host, "port": port, "password": uuid_or_pass}]}
                      
                  net = qs.get("type", ["tcp"])[0]
                  outbound["streamSettings"]["network"] = net
                  if net == "ws":
                      outbound["streamSettings"]["wsSettings"] = {
                          "path": qs.get("path", ["/"])[0],
                          "headers": {"Host": qs.get("host", [""])[0]} if qs.get("host") else {}
                      }
                      
                  security = qs.get("security", ["none"])[0]
                  if security in ["tls", "reality"]:
                      outbound["streamSettings"]["security"] = security
                      outbound["streamSettings"][f"{security}Settings"] = {"serverName": qs.get("sni", [""])[0] or host}
                      # 适配目前流行的 Reality 协议参数
                      if security == "reality":
                          outbound["streamSettings"]["realitySettings"] = {
                              "publicKey": qs.get("pbk", [""])[0],
                              "shortId": qs.get("sid", [""])[0],
                              "fingerprint": qs.get("fp", ["chrome"])[0]
                          }
          
              # ======= 处理 Socks5 协议 =======
              elif link.startswith("socks5://"):
                  outbound["protocol"] = "socks"
                  parsed = urlparse(link)
                  server = {"address": parsed.hostname, "port": parsed.port or 1080}
                  if parsed.username:
                      server["users"] = [{"user": parsed.username, "pass": parsed.password or ""}]
                  outbound["settings"] = {"servers": [server]}
          
              else:
                  print(f"❌ 暂不支持自动解析此协议: {link[:10]}...")
                  sys.exit(1)
          
              # 3. 将组装好的出站规则加入到总配置中
              config["outbounds"].append(outbound)
              
              # 4. 生成 Xray 能够识别的 JSON 配置文件
              with open("config.json", "w", encoding="utf-8") as f:
                  json.dump(config, f, indent=2)
                  
              print(f"✅ 成功将 {link[:8]}... 链接转换为 config.json 配置文件！")
              
          except Exception as e:
              print(f"❌ 解析链接时发生致命错误: {e}")
              sys.exit(1)
          EOF
          
          echo ">>> 正在执行节点解析..."
          # 使用 -u 参数进行无缓冲执行，确保错误信息能够第一时间打印
          python -u parse_proxy.py
          
          echo ">>> 启动 Xray 代理客户端..."
          nohup ./xray run -c config.json > proxy.log 2>&1 &
          sleep 5

      - name: 运行自动化脚本 (全局接管网络 + 虚拟屏幕)
        env:
          acount: ${{ secrets.ACOUNT }}
          # 本地代理端口已由上面的 Python 代码固定生成为 10808
          HTTP_PROXY: socks5://127.0.0.1:10808
          HTTPS_PROXY: socks5://127.0.0.1:10808
          NO_PROXY: localhost,127.0.0.1,::1
        run: |
          curl -x socks5://127.0.0.1:10808 -I https://www.baidu.com --connect-timeout 10 || { 
            echo "❌ 代理连接失败！为您提取底层日志："; 
            echo "================ Xray 运行日志 ================";
            cat proxy.log;
            echo "====================================================";
            exit 1; 
          }
          
          # 安装虚拟屏幕和字体（不屏蔽输出）
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk
          
          echo ">>> 🚀 开始执行自动登录 Python 脚本..."
          # 同样加上 -u 参数以保证实时的无缓冲日志输出
          xvfb-run --server-args="-screen 0 1920x1080x24" python -u auto_login.py

      - name: 上传运行过程截图与日志文件
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Auto-Login-Results
          path: |
            screenshots/
            proxy.log
          retention-days: 7
