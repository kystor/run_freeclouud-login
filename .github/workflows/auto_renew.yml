name: 多账号自动登录续期任务

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 获取代码仓库
        uses: actions/checkout@v3

      - name: 配置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖包
        # 直接安装依赖，日志将直观显示在 GitHub Actions 控制台中
        run: |
          pip install seleniumbase ddddocr PyAutoGUI

      - name: 安装并配置 Cloudflare WARP (官方原生 IP 代理)
        run: |
          # 1. 导入 Cloudflare 官方 GPG 密钥，用于验证软件源的安全性
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          
          # 2. 将 Cloudflare 官方软件源添加到 Ubuntu 系统的列表中
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          
          # 3. 更新系统软件源，并静默安装 WARP 客户端
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          
          # 4. 注册免费的 WARP 虚拟账户 (自动接受服务条款)
          sudo warp-cli --accept-tos registration new
          
          # 5. 设置为 Proxy 代理模式 (将生成一个本地 SOCKS5 端口，防止接管全局网络导致 Actions 断网)
          sudo warp-cli --accept-tos mode proxy
          
          # 6. 绑定本地 SOCKS5 代理端口为 10808 (与后面的 Python 脚本环境变量完美对接)
          sudo warp-cli --accept-tos proxy port 10808
          
          # 7. 启动连接，接入 Cloudflare 网络
          sudo warp-cli --accept-tos connect
          
          # 等待 5 秒钟，确保底层网络通道建立成功
          sleep 5

      - name: 运行自动化脚本 (虚拟屏幕 + WARP 代理)
        env:
          # 读取你在 Secrets 中配置的账号密码
          acount: ${{ secrets.ACOUNT }}
          # 强制全局通过刚刚配置好的 WARP 官方本地代理端口 (10808) 访问外部网络
          HTTP_PROXY: socks5://127.0.0.1:10808
          HTTPS_PROXY: socks5://127.0.0.1:10808
          NO_PROXY: localhost,127.0.0.1,::1
        run: |
          # 验证代理内核是否能正常获取到 Cloudflare 的真实高信任度 IP
          echo ">>> 正在检测当前 WARP 代理节点的公网 IP 信息..."
          curl -sS -x socks5://127.0.0.1:10808 https://ipinfo.io || echo "❌ 获取 IP 信息失败"
          echo "------------------------------------------------"
          
          # 安装虚拟显示器组件（xvfb）和中文字体，确保验证码图片渲染正常
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk
          
          # 启动虚拟屏幕并运行 Python 登录脚本
          # 添加了 -u 参数以开启无缓冲模式，确保你能实时看到完整的运行日志
          xvfb-run --server-args="-screen 0 1920x1080x24" python -u auto_login.py

      - name: 上传运行过程截图与日志文件
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Auto-Login-Results
          path: |
            screenshots/
            *.log
          retention-days: 7
