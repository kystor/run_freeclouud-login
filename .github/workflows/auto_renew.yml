name: 多账号自动登录续期任务

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 获取代码仓库
        uses: actions/checkout@v3

      - name: 配置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖包
        run: |
          # 屏蔽 pip 安装过程的杂乱信息，全部写入日志文件
          pip install seleniumbase ddddocr PyAutoGUI >> init_env.log 2>&1

      - name: 智能解析节点并启动代理核心
        env:
          proxy: ${{ secrets.PROXY }}
        run: |
          # 1. 以后台且静默的方式下载和启动 Subconverter（节点转换器）
          wget -qO sub.tar.gz https://github.com/tindy2013/subconverter/releases/latest/download/subconverter_linux64.tar.gz >> init_env.log 2>&1
          tar -zxf sub.tar.gz >> init_env.log 2>&1
          chmod +x subconverter/subconverter
          nohup ./subconverter/subconverter > sub.log 2>&1 &

          # 2. 静默下载并准备 Mihomo（代理核心）
          wget -qO mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.18.3/mihomo-linux-amd64-v1.18.3.gz >> init_env.log 2>&1
          gunzip mihomo.gz >> init_env.log 2>&1
          chmod +x mihomo

          sleep 3

          # 3. 校验密钥是否填写，错误信息只存入日志
          if [ -z "$proxy" ]; then
            echo "❌ 严重错误：未提取到节点链接，请检查 GitHub Secrets" >> init_env.log 2>&1
            exit 1
          fi

          # 4. 使用 Python 脚本对节点 URL 进行编码，屏蔽不必要的系统信息输出
          cat << 'EOF' > url_encode.py
          import urllib.parse
          import os
          url = os.environ.get('proxy', '').strip()
          print(urllib.parse.quote(url, safe=''))
          EOF
          ENCODED_PROXY=$(python -u url_encode.py)

          # 5. 请求转换节点格式，将配置保存为 config.yaml，报错信息丢进日志
          curl -s "http://127.0.0.1:25500/sub?target=clash&url=${ENCODED_PROXY}" > config.yaml 2>> init_env.log

          # 检查配置是否生成成功
          if ! grep -q "proxies:" config.yaml; then
              echo "❌ 节点解析失败！请检查您的节点链接格式" >> init_env.log 2>&1
              exit 1
          fi

          # 6. 静默修改代理端口为 10808
          sed -i '/^mixed-port:/d' config.yaml
          sed -i '/^port:/d' config.yaml
          sed -i '/^socks-port:/d' config.yaml
          echo -e "\nmixed-port: 10808" >> config.yaml

          # 7. 在后台启动代理客户端，日志独立存放
          nohup ./mihomo -f config.yaml > proxy.log 2>&1 &
          sleep 5

      - name: 运行自动化脚本
        env:
          acount: ${{ secrets.ACOUNT }}
          HTTP_PROXY: socks5://127.0.0.1:10808
          HTTPS_PROXY: socks5://127.0.0.1:10808
          NO_PROXY: localhost,127.0.0.1,::1
        run: |
          # 静默测试代理连通性，如果失败则直接退出，排查时可去下载 proxy.log 查看
          curl -x socks5://127.0.0.1:10808 -I https://www.baidu.com --connect-timeout 10 >> init_env.log 2>&1 || exit 1
          
          # 静默安装虚拟屏幕所需环境，避免输出大段 apt-get 获取进度
          sudo apt-get update >> init_env.log 2>&1
          sudo apt-get install -y xvfb fonts-noto-cjk >> init_env.log 2>&1
          
          # 【唯一输出到控制台的步骤】
          # 使用 -u 参数保证 Python 实时输出日志。不屏蔽此处输出，便于你直接在控制台监控业务进展
          xvfb-run --server-args="-screen 0 1920x1080x24" python -u auto_login.py

      - name: 上传运行日志与截图
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Auto-Login-Results
          path: |
            screenshots/
            init_env.log
            proxy.log
            sub.log
          retention-days: 7
